---
# BEAI — AI Integration Tests (D36)
#
# Runs only @ai-tagged Pest tests that call a REAL LLM API.
# These tests use real AI API credits — the cheap haiku model is used (AI_TEST_MODEL).
#
# NEVER triggered automatically on PR or develop push.
# Triggers: manual dispatch (operators) or release/* branches (pre-release gate).
#
# Required secrets: ANTHROPIC_API_KEY, AI_TEST_MODEL (default: claude-haiku-4-5-20251001)

on:
  workflow_dispatch: {}
  push:
    branches:
      - 'release/**'

jobs:
  ai-integration:
    name: AI Integration Tests (@ai group)
    runs-on: ubuntu-latest

    # Job-wide, because this job has a postgres service and NOTHING else. Every
    # step set DB_* and left the cache, queue and session drivers to config —
    # which resolves to redis, and there is no redis here. `artisan migrate`
    # died on RedisException: Connection refused before running a single
    # migration, and the postgres log's "pulse_entries does not exist" from a
    # later moment made it look like a Pulse ordering problem it was not.
    #
    # array/sync need no service and no cleanup between runs. Adding a redis
    # service instead would buy nothing: nothing in the @ai group exercises the
    # queue or the cache, and a service is one more thing to keep healthy.
    env:
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      PULSE_ENABLED: false

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.5 with PCOV and pdo_pgsql
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pcov
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations (beai_test database)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: beai_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan migrate --force

      # Every test in the @ai group self-skips when ANTHROPIC_API_KEY is empty,
      # and a run of nothing but skips exits 0. So this lane reported SUCCESS
      # on every run since 2026-08-13 while asserting nothing: the one run that
      # actually contained RubricAdherenceDriftTest logged
      # "Tests: 2 skipped (0 assertions)" and concluded success, and a task was
      # ticked on the strength of it reading "still green". It was skipped, not
      # green.
      #
      # That test's own docblock calls it the ONLY mechanism in the suite that
      # can detect the model drawing the exceeds/meets line differently — which
      # is exactly what a prompt severity recalibration changes, and exactly the
      # kind of change this lane exists to gate.
      #
      # Fail loudly instead. A red lane that says "the secret is missing" is
      # worth more than a green one that checked nothing, and it matches what
      # the rest of this codebase already does: MailSelfTestCommand refuses to
      # report success on a transport that delivers nothing, and
      # BackofficeOrigin returns null rather than mint a broken link.
      - name: Assert the AI credentials are actually present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set for this repository."
            echo "Every @ai test would self-skip and this job would exit 0 having"
            echo "asserted nothing — a green light over an unrun gate."
            echo "Set the repository secret, or do not run this workflow."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY present — the @ai group will actually execute."

      - name: Run @ai group tests (real LLM API — uses AI credits)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: beai_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_TEST_MODEL: ${{ secrets.AI_TEST_MODEL || 'claude-haiku-4-5-20251001' }}
          APP_ENV: testing
        run: php artisan test --group ai
        # NOTE: no --parallel here — AI tests must be sequential to avoid
        # concurrent API calls that inflate costs.
