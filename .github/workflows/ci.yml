name: API CI

# Every long-lived branch, not just develop. With develop alone, a release/**
# or hotfix/** branch reached main having run only the @ai job — so the one
# merge that ships to production was the least tested one in the flow.
on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'

jobs:
  test:
    name: Lint · Analyse · Test · OpenAPI · Docker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      # Pinned so `scramble:export`'s servers[0].url (built from APP_URL by
      # Generator.php) is environment-coupled to a KNOWN value rather than to
      # Laravel's `env('APP_URL', 'http://localhost')` default — the freshness
      # gate below must fail on a real contract change, never on a server URL
      # that happened to match the committed file by accident of the default
      # (generated-client-truth-and-session-safety D2).
      APP_URL: http://localhost
      # Throwaway 32-byte key for CI only (aes-256-cbc); NOT a production secret.
      # The placeholder previously here was an invalid cipher length and broke
      # any test that encrypts a field (e.g. webhook_secret encrypted cast).
      APP_KEY: base64:/RbDHF9zcNfJtZX1fRWXfBOPQnh1f2vpFpTNs8URgOY=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: beai_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Framework catalog (binding JSON owned by the wrapper superproject) ─
      # The seeder and catalog tests resolve dirname(base_path())/docs/app_description/…
      # (the wrapper root, one level above the api submodule). In standalone CI
      # only the api repo is checked out, so fetch the catalog from the public
      # wrapper repo and place it one level above the workspace where the code
      # expects it. Sparse + blobless keeps it to just the docs tree.
      - name: Fetch framework catalog from wrapper
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/micio86dev/avatar-test.git "$RUNNER_TEMP/wrapper"
          git -C "$RUNNER_TEMP/wrapper" sparse-checkout set docs/app_description
          mkdir -p "$RUNNER_WORKSPACE/docs"
          cp -r "$RUNNER_TEMP/wrapper/docs/app_description" "$RUNNER_WORKSPACE/docs/"
          test -f "$RUNNER_WORKSPACE/docs/app_description/02-domain/framework/roles.json" \
            && echo "framework catalog in place"

      - name: Setup PHP 8.5 + PCOV + pdo_pgsql
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo, pdo_pgsql, pcov, zip, opcache
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # ── Security audit ────────────────────────────────────────────────────
      - name: Security audit
        run: composer audit --no-dev

      # ── Lint (Pint) ───────────────────────────────────────────────────────
      - name: Lint (Pint)
        run: ./vendor/bin/pint --test

      # ── Static analysis (PHPStan level 8) ─────────────────────────────────
      - name: Static analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      # ── Run migrations against beai_test ──────────────────────────────────
      - name: Run migrations
        run: php artisan migrate --force --env=testing

      # ── Pest test suite (all tiers, required) ─────────────────────────────
      - name: Run tests
        run: php artisan test --parallel

      # ── Coverage gate (85% minimum) ───────────────────────────────────────
      # `-d memory_limit=2G` is required, not defensive. PCOV holds the whole
      # line map in memory and the report renderer builds every class summary
      # before printing; at PHP's default 128M the process dies with a
      # FatalError *after* the suite has already passed, which reads as a
      # coverage failure when it is really an OOM. Reproduced locally on
      # 2026-08-26 at the exact commit that first crossed the limit. The
      # phpstan step above already carries `--memory-limit=1G` for the same
      # class of reason.
      - name: Test coverage (≥85%)
        run: php -d memory_limit=2G artisan test --coverage --min=85

      # ── Generate OpenAPI spec (Scramble) ──────────────────────────────────
      - name: Generate OpenAPI spec
        run: php artisan scramble:export

      # ── Freshness gate: the committed snapshot MUST match a fresh export ───
      # Proves the committed api/openapi.json is TRUE (matches a live
      # regeneration of the CURRENT code), not merely that Scramble can
      # produce a document — the exact class of drift that let ten mistyped
      # resources and a `ProfileResource.locale` staleness ship undetected
      # (generated-client-truth-and-session-safety D2/proposal). Verified
      # byte-deterministic across two consecutive local exports on unchanged
      # code before this step was enabled; if that ever stops holding, switch
      # to the canonicalised-JSON comparison `wrapper-ci.yml` already uses for
      # its three-way diff instead of weakening this to a grep.
      - name: Assert committed openapi.json matches a fresh export
        run: git diff --exit-code openapi.json

      - name: Assert openapi.json produced
        run: test -f openapi.json && echo "openapi.json OK"

      # ── Assert OpenAPI version matches VERSION file ────────────────────────
      # This one alone was never enough: openapi.json's info.version is GENERATED
      # from VERSION, so it compared the file against itself and passed for every
      # release from v0.2.0 to v0.3.0 while VERSION sat at 0.1.0 — publishing a
      # contract that claimed the same version release after release, to clients
      # that generate their typed TS client from exactly this field.
      - name: Assert openapi.json version matches VERSION
        run: |
          API_VERSION=$(cat VERSION | tr -d '[:space:]')
          OAS_VERSION=$(php -r "echo json_decode(file_get_contents('openapi.json'), true)['info']['version'] ?? '';")
          echo "VERSION file: $API_VERSION | openapi.json info.version: $OAS_VERSION"
          [ "$OAS_VERSION" = "$API_VERSION" ] || (echo "Version mismatch!" && exit 1)

      # The anchor the check above lacks: composer.json is what a release bump
      # touches, so tying VERSION to it means a bumped release can no longer
      # publish a stale contract version.
      - name: Assert VERSION matches composer.json
        run: |
          API_VERSION=$(cat VERSION | tr -d '[:space:]')
          PKG_VERSION=$(php -r "echo json_decode(file_get_contents('composer.json'), true)['version'] ?? '';")
          echo "VERSION file: $API_VERSION | composer.json version: $PKG_VERSION"
          [ -n "$PKG_VERSION" ] || (echo "composer.json has no version field!" && exit 1)
          [ "$PKG_VERSION" = "$API_VERSION" ] || (echo "Version mismatch!" && exit 1)

      # ── Docker image build (no push) ──────────────────────────────────────
      - name: Build Docker image
        run: docker build -t beai-api:ci .

      # ── Tier 1: image smoke test (queue-worker-scheduler PR4, design.md D8) ──
      # The build step above builds the image but never runs it — this asserts
      # the runtime extensions PR1 added are actually present, and that the
      # config invariant (PR1/PR4's App\Support\Queue\QueueRuntimeInvariant)
      # holds inside the REAL built image, in ~5s, without provisioning Redis.
      - name: Docker image smoke test — required extensions present
        run: |
          MODULES=$(docker run --rm beai-api:ci php -m)
          for ext in pcntl posix redis; do
            echo "$MODULES" | grep -qi "^${ext}$" && echo "$ext: OK" || (echo "$ext: MISSING" && exit 1)
          done

      - name: Docker image smoke test — beai:queue-work --validate-only
        run: docker run --rm beai-api:ci php artisan beai:queue-work --validate-only

  queue-real-worker:
    name: Queue · Real Redis Worker (Tier 2)
    runs-on: ubuntu-latest
    # queue-runtime/spec.md "CI Verifies the Real-Worker Path": `sync` stays
    # the default driver for the main `test` job above (deterministic — the
    # null-org bug class this codebase has hit before reproduces under sync
    # because Queue::before fires there too). This SEPARATE job is the one
    # place the redis driver is exercised for real: nothing else proves it
    # actually serializes/deserializes our jobs and preserves the
    # queue-context tenancy contract. Marginal value over Tier 1 + sync is
    # genuinely low, but the guarded failure (silent non-delivery in
    # production) is severe.

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: testing
      APP_KEY: base64:/RbDHF9zcNfJtZX1fRWXfBOPQnh1f2vpFpTNs8URgOY=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: beai_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_CLIENT: phpredis
      CACHE_STORE: database
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: array

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch framework catalog from wrapper
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/micio86dev/avatar-test.git "$RUNNER_TEMP/wrapper"
          git -C "$RUNNER_TEMP/wrapper" sparse-checkout set docs/app_description
          mkdir -p "$RUNNER_WORKSPACE/docs"
          cp -r "$RUNNER_TEMP/wrapper/docs/app_description" "$RUNNER_WORKSPACE/docs/"
          test -f "$RUNNER_WORKSPACE/docs/app_description/02-domain/framework/roles.json" \
            && echo "framework catalog in place"

      # pcntl/posix/redis added on top of the main job's extension set — the
      # real-worker job needs the same runtime capability the Docker image
      # has (PR1's Dockerfile), since it dispatches onto and drains from a
      # REAL Redis service container.
      - name: Setup PHP 8.5 + PCOV + pdo_pgsql + pcntl + posix + redis
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo, pdo_pgsql, pcov, zip, opcache, pcntl, posix, redis
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run migrations
        run: php artisan migrate --force --env=testing

      # Only the one file that dispatches onto and drains from the real
      # redis connection — the rest of the suite intentionally stays on
      # `sync` in the main `test` job.
      - name: Run real-worker redis driver test
        run: ./vendor/bin/pest tests/Feature/Queue/RealWorkerRedisDriverTest.php
