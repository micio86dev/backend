; Two processes in one container, so something has to own them.
;
; supervisord rather than `php-fpm -D && nginx -g 'daemon off;'`: with the
; backgrounded form, php-fpm dying leaves nginx running and the container
; looking healthy while every request 502s. Here, either process exiting takes
; the container down, and the platform restarts it.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; -e /dev/stderr, not just the error_log directive in nginx.conf: nginx opens its
; compiled-in default error log BEFORE it parses the config, and on Alpine that
; path (/var/lib/nginx/logs) is a symlink to /var/log/nginx, which `chown -R`
; does not traverse. The non-root user cannot write there, so every start
; emitted a permission-denied alert before reaching the directive that says to
; log to stderr anyway.
[program:nginx]
command=nginx -e /dev/stderr -g "daemon off;"
autorestart=false
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Either one exiting ends the container rather than leaving a half-dead one
; serving 502s behind a green healthcheck.
[eventlistener:quit_on_exit]
command=sh -c 'printf "READY\n"; while read -r line; do kill -SIGQUIT $PPID; done'
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
