# nginx in front of php-fpm (C14 production runtime).
#
# Replaces `php artisan serve`, which is Laravel's DEVELOPMENT server: single
# request at a time, explicitly documented as unsuitable for production, and
# what this image ran as its entrypoint until now. The base image has always
# been php-fpm-alpine, so fpm was present and unused.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # To stdout/stderr, not files: a container's logs belong to the platform,
    # and a log file on an ephemeral filesystem is a log nobody reads.
    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Every path nginx writes to must be under /tmp: the container runs as a
    # non-root user and the default locations are not writable.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Snapshot uploads are base64 and capped at ~2.7 MB encoded server-side
    # (config/interview.php). 8m leaves room for the multipart envelope without
    # letting nginx reject what the application is willing to consider.
    client_max_body_size 8m;

    keepalive_timeout 65;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    server {
        listen 8000;
        server_name _;
        root /var/www/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # Scoring is asynchronous, but an interview turn waits on a provider
            # round trip. 60s is the provider timeout in config/interview.php;
            # nginx must not give up before the application does, or the client
            # sees a 504 for a request that was still alive.
            fastcgi_read_timeout 75s;
        }

        # Nothing under a dot is ever served — .env, .git, and anything else
        # somebody drops in by accident.
        location ~ /\. {
            deny all;
        }
    }
}
